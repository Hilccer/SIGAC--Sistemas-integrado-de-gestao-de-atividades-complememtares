<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAC - Sistema Integrado de Gestão de Atividades Complementares</title>

    <link rel="stylesheet" href="sigac.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- TOPO -->
<nav class="barratopo">
    <h2>SIGAC</h2>

    <div class="menu-topo">
        <span><i class="fa-solid fa-user"></i> Usuário</span>

        <div class="top-icons">
            <div class="notificacao">
                <i class="fa-solid fa-bell"></i>
                <span class="badge">3</span>
            </div>
        </div>
    </div>
</nav>

<!-- MENSAGEM -->
<header class="boas-vindas">
    <h1>Bem-vindo ao sistema SIGAC</h1>
</header>

<!-- LOGIN -->
<div class="login-container">
    <h1>Login</h1>

    <form id="login-form">
        <input type="text" id="usuario" placeholder="Usuário" required>
        <input type="password" id="senha" placeholder="Senha" required>

        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
