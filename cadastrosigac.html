<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAC - Cadastro</title>

    <link rel="stylesheet" href="sigac.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<nav class="barratopo">
    <h2>SIGAC</h2>

    <div class="menu-topo">
        <span><i class="fa-solid fa-user"></i> Usuários</span>

        <div class="top-icons">
            <div class="notificacao">
                <i class="fa-solid fa-bell"></i>
                <span class="badge">3</span>
            </div>
        </div>
    </div>
</nav>

<header class="navbar">
    <h1>Bem-vindo ao sistema SIGAC</h1>
</header>

<section class="CadastroAluno">
    <h1>Cadastro do Novo Aluno</h1>

    <form id="form-cadastro">

        <h2>Dados pessoais</h2>
        <input type="text" name="nome" placeholder="Nome Completo" required>
        <input type="date" name="nascimento" required>
        <input type="text" name="cpf" placeholder="CPF" required>

        <select name="sexo" required>
            <option value="">Sexo</option>
            <option>Masculino</option>
            <option>Feminino</option>
        </select>

        <input type="text" name="telefone" placeholder="Telefone">
        <input type="email" name="email" placeholder="Email" required>

        <input type="password" name="senha" placeholder="Senha" required>

        <h3>Endereço</h3>
        <input type="text" name="rua" placeholder="Rua">
        <input type="text" name="numero" placeholder="Número">
        <input type="text" name="bairro" placeholder="Bairro">
        <input type="text" name="cidade" placeholder="Cidade">
        <input type="text" name="uf" placeholder="UF">

        <h4>Curso</h4>
        <select name="curso" required>
            <option value="">Escolha o curso</option>
            <option>ADS</option>
            <option>Design Gráfico</option>
            <option>Gestão Comercial</option>
            <option>TI</option>
            <option>RH</option>
            <option>Financeiro</option>
            <option>Jogos Digitais</option>
            <option>Marketing</option>
        </select>

        <select name="turno" required>
            <option value="">Turno</option>
            <option>Manhã</option>
            <option>Tarde</option>
            <option>Noite</option>
        </select>

        <button type="submit">Cadastrar</button>

    </form>
</section>

<footer>
    © 2026 Equipe DevTech. Todos os direitos reservados.<br>
    Desenvolvido por:
    Einstein, Hilce, Guilherme, Arthur, Isaque, Gabriel
</footer>

<script src="script.js"></script>

</body>
</html>
